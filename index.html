<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cadence 节律 · 日程 · 提醒 · 目标</title>
  <meta name="description" content="Cadence 节律 — 本地优先的个人日程、提醒与目标追踪应用。数据只存在你的设备上。">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191817" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="节律">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = "auto";
      try { t = (JSON.parse(localStorage.getItem("cadence.v1") || "{}").settings || {}).theme || "auto"; } catch (e) {}
      var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <svg hidden aria-hidden="true" focusable="false">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></symbol>
    <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 9.3-5M18 9c0 5 2 6 2 6H8"/><path d="M10.5 20a2 2 0 0 0 3 0M3 3l18 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14.5 5.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c0-1 0-2-.5-3 2 2 3.5 4 3.5 6.5a5 5 0 0 1-10 0C7 9 11 7 12 3z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 9a5 5 0 0 1 5-5h9M18 4l-2 2 2 2M20 15a5 5 0 0 1-5 5H6M6 20l2-2-2-2"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h4l1 2h6l1-2h4"/></symbol>
  </svg>

  <header class="appbar">
    <div class="appbar__brand">
      <span class="appbar__mark" aria-hidden="true">节律</span>
      <span class="appbar__name">Cadence</span>
    </div>
    <div class="appbar__actions">
      <button id="btn-notify" class="btn btn--icon" type="button" aria-label="启用提醒通知" title="启用提醒通知">
        <svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg>
      </button>
      <button id="btn-theme" class="btn btn--icon" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>
      </button>
      <button id="btn-ics" class="btn btn--icon" type="button" aria-label="导出日历 (.ics)" title="导出日历 (.ics)">
        <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
      </button>
      <button id="btn-export" class="btn btn--icon" type="button" aria-label="导出数据 (JSON)" title="导出数据 (JSON)">
        <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
      </button>
      <button id="btn-import" class="btn btn--icon" type="button" aria-label="导入数据 (JSON)" title="导入数据 (JSON)">
        <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app">
    <section id="missed" class="banner" aria-live="polite" hidden></section>
    <nav id="modules" class="modules" aria-label="模块"></nav>
    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <footer class="appfoot">
    <span>数据仅保存在本机 · 提醒仅在本页打开时生效</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="sheet-root"></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <script type="module" src="src/app.js"></script>
</body>
</html>
